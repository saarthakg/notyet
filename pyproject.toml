[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notyet"
version = "0.2.0"
description = "A completion gate for AI coding agents: when the agent says it's done, check whether it is."
readme = "README.md"
requires-python = ">=3.11"  # tomllib
license = {text = "MIT"}
dependencies = []            # standard library only: it runs inside other projects' environments

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-xdist", "pytest-cov", "ruff", "pyright"]  # ruff/pyright: the static engine's tests; the plugins: scenarios

[project.scripts]
notyet = "notyet.cli:main"

[tool.ruff]
line-length = 130

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "PLE"]
ignore = ["B005", "B007", "B904", "B905"]

[tool.ruff.lint.per-file-ignores]
"eval/redteam/*.py" = ["E402", "E702", "E741", "F403", "F405"]
"eval/notyet_scenarios.py" = ["E702"]       # one-line setups read better as a table

[tool.setuptools.packages.find]
include = ["notyet*"]
