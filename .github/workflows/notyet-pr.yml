# Throwaway: tries the notyet Action's pull request comment on this repo.
name: notyet on pull requests
on: pull_request
permissions:
  contents: read
  pull-requests: write
jobs:
  notyet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv .venv && .venv/bin/pip install -q -e ".[dev]"
      - uses: ./
        with:
          version: .
